name: Tests

# One exact source gate. A repository-owned classifier selects bounded lanes;
# the always-run `gate` job is the sole branch-protection check.
on:
  pull_request:
    paths:
      - 'lightweaver/**'
      - 'led-art-mapper/**'
      - 'packages/installer-core/**'
      - 'firmware/**'
      - 'release/**'
      - 'scripts/**'
      - 'docs/**'
      - 'TODO.md'
      - '.github/workflows/**'
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'lightweaver/**'
      - 'led-art-mapper/**'
      - 'packages/installer-core/**'
      - 'firmware/**'
      - 'release/**'
      - 'scripts/**'
      - 'docs/**'
      - 'TODO.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.lanes.outputs.source }}
      browser: ${{ steps.lanes.outputs.browser }}
      cloud: ${{ steps.lanes.outputs.cloud }}
      production: ${{ steps.lanes.outputs.production }}
      firmware: ${{ steps.lanes.outputs.firmware }}
      artifact: ${{ steps.lanes.outputs.artifact }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select exact changed-path lanes
        id: lanes
        env:
          CI_ACTOR: ${{ github.actor }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ "$CI_ACTOR" = "github-actions[bot]" ] \
            && [ "$(git log -1 --format=%s "$CI_HEAD_SHA")" = "CI: publish signed Lightweaver firmware release" ]; then
            export CI_GENERATED_RELEASE=true
          fi
          node scripts/ci-changed-lanes.mjs

  source:
    needs: classify
    if: needs.classify.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            lightweaver/package-lock.json
            led-art-mapper/app/package-lock.json
      - name: Install pinned source dependencies
        run: |
          npm ci --prefix lightweaver
          node lightweaver/scripts/ensure-rollup-native.mjs
          npm ci --prefix led-art-mapper/app
          npx --prefix lightweaver playwright install --with-deps chromium
      - name: Apply D1 migrations to isolated local CI state
        working-directory: lightweaver
        run: npm exec -- wrangler d1 migrations apply PROJECTS_DB --config wrangler.local.toml --local --persist-to .wrangler/ci-state
      - name: Run bounded source and build gate
        working-directory: lightweaver
        run: npm run ci:source-build

  browser:
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ubuntu-latest
    name: browser smoke
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the build number is the total commit count, and a
          # shallow clone would silently publish "build 1".
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: node scripts/ensure-rollup-native.mjs
        working-directory: lightweaver
      - run: npx playwright install --with-deps chromium
        working-directory: lightweaver
      - name: Run focused critical-workflow smoke tests
        working-directory: lightweaver
        run: |
          npm run ci:browser-smoke
          npm run test:windowless:browser

  cloud:
    needs: classify
    if: needs.classify.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the build number is the total commit count, and a
          # shallow clone would silently publish "build 1".
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: node scripts/ensure-rollup-native.mjs
        working-directory: lightweaver
      - run: npx playwright install --with-deps chromium
        working-directory: lightweaver
      - run: npm run ci:cloud
        working-directory: lightweaver

  production:
    needs: classify
    if: needs.classify.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the build number is the total commit count, and a
          # shallow clone would silently publish "build 1".
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: node scripts/ensure-rollup-native.mjs
        working-directory: lightweaver
      - run: npx playwright install --with-deps chromium
        working-directory: lightweaver
      - run: npm run ci:production
        working-directory: lightweaver

  firmware:
    needs: classify
    if: needs.classify.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/lightweaver-controller/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: |
          pip install platformio==6.1.19
          npm ci --prefix lightweaver
      - run: npm run ci:firmware-sensitive
        working-directory: lightweaver
      - name: Resolve the release build number
        id: buildnumber
        run: echo "value=$(git rev-list --count "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Compile pinned firmware with exact source identity
        env:
          LW_BUILD_ID: ${{ github.sha }}
          LW_BUILD_NUMBER: ${{ steps.buildnumber.outputs.value }}
        run: |
          npm run build:card --prefix lightweaver
          pio run -d firmware/lightweaver-controller -e esp32-s3-n16r8
          node firmware/lightweaver-controller/tests/card-identity-capabilities.mjs
          node firmware/lightweaver-controller/tests/windowless-card-studio.mjs

  artifact:
    needs: classify
    if: needs.classify.outputs.artifact == 'true' && needs.classify.outputs.firmware != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: npm run ci:artifact
        working-directory: lightweaver

  gate:
    name: gate
    if: ${{ always() }}
    needs: [classify, source, browser, cloud, production, firmware, artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY: ${{ needs.classify.result }}
          SOURCE: ${{ needs.source.result }}
          BROWSER: ${{ needs.browser.result }}
          CLOUD: ${{ needs.cloud.result }}
          PRODUCTION: ${{ needs.production.result }}
          FIRMWARE: ${{ needs.firmware.result }}
          ARTIFACT: ${{ needs.artifact.result }}
        run: |
          for result in "$CLASSIFY" "$SOURCE" "$BROWSER" "$CLOUD" "$PRODUCTION" "$FIRMWARE" "$ARTIFACT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A selected Lightweaver CI lane did not pass."
              exit 1
            fi
          done
          echo "Every selected Lightweaver CI lane passed."
