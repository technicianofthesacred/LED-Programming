name: Deploy site

# Publishes THIS repo's Studio bundle to PRODUCTION at led.mandalacodes.com.
#
# Deploy ownership (updated 2026-07-13, see docs/led-mandalacodes-setup.md):
# led.mandalacodes.com is the custom domain on the `lightweaver` Cloudflare
# Pages project, whose production branch is `main`. `npm run deploy:pages`
# stages this repo's Studio (Show screen included) directly at `/` and deploys
# it to `--branch main`, i.e. the live domain. So a push to this repo's
# main IS the live deploy — there is no separate mandalacodes step for the LED
# surface. (mandalacodes.com itself stays a different project; it must NOT also
# publish to `lightweaver`, or the two would overwrite each other.)
#
# GATE: this only publishes when the Pages credential, the separate D1
# migration credential, and the private-library resource configuration are set
# on THIS repo. Until then the deploy step skips cleanly and nothing reaches the
# live domain.
#
# A successful main Tests run supplies the exact revision. Firmware-sensitive
# revisions wait for the protected signer, which dispatches the resulting
# signed commit explicitly. Deploy never silently substitutes a newer main.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Set to "ci" by build-firmware.yml; leave as "manual" for human runs
        required: false
        default: manual
      revision:
        description: Exact tested or signed main revision to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-site
  # Automatic Tests completions queue behind a signer-owned dispatch so an
  # artifact-only completion cannot cancel/restart the exact signed deploy.
  # An explicit signed/manual dispatch may supersede an older automatic run.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      revision: ${{ steps.resolve.outputs.revision }}
      reason: ${{ steps.resolve.outputs.reason }}
      awaiting_signer: ${{ steps.resolve.outputs.awaiting_signer }}
    steps:
      - name: Resolve the authorized revision
        id: revision
        env:
          DISPATCH_REVISION: ${{ github.event.inputs.revision }}
          EVENT_NAME: ${{ github.event_name }}
          TESTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            revision="$TESTED_REVISION"
          else
            revision="$DISPATCH_REVISION"
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deploy revision must be a complete 40-character commit SHA."
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.revision.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Confirm main still names that exact revision
        env:
          DEPLOY_REVISION: ${{ steps.revision.outputs.revision }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$DEPLOY_REVISION" ]; then
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "stale=true" >> "$GITHUB_ENV"
            else
              echo "::error::Requested revision is not current origin/main."
              exit 1
            fi
          fi
      - name: Classify the exact revision
        id: changes
        env:
          CI_BASE_SHA: ${{ steps.revision.outputs.revision }}^
          CI_HEAD_SHA: ${{ steps.revision.outputs.revision }}
        run: |
          expected_signer_email="$(sed -n 's/.*git config user.email "\([^"]*\)".*/\1/p' .github/workflows/build-firmware.yml)"
          test -n "$expected_signer_email"
          if [ "$(git log -1 --format=%s "$CI_HEAD_SHA")" = "CI: publish signed Lightweaver firmware release" ] \
            && [ "$(git log -1 --format=%ce "$CI_HEAD_SHA")" = "$expected_signer_email" ]; then
            export CI_GENERATED_RELEASE=true
          fi
          node scripts/ci-changed-lanes.mjs
      - name: Authorize direct deployment or defer to signer
        id: resolve
        env:
          ARTIFACT_ONLY: ${{ steps.changes.outputs.artifact }}
          DEPLOY_REVISION: ${{ steps.revision.outputs.revision }}
          EVENT_NAME: ${{ github.event_name }}
          FIRMWARE_SENSITIVE: ${{ steps.changes.outputs.firmware }}
          SIGNED_RELEASE_COMMIT: ${{ steps.changes.outputs.signed_release }}
        run: |
          echo "revision=$DEPLOY_REVISION" >> "$GITHUB_OUTPUT"
          if [ "${stale:-}" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=A newer main revision owns deployment." >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$ARTIFACT_ONLY" = "true" ] && [ "$FIRMWARE_SENSITIVE" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=Signer artifact commits deploy only through their explicit signed-SHA dispatch." >> "$GITHUB_OUTPUT"
          elif [ "$FIRMWARE_SENSITIVE" = "true" ] && [ "$SIGNED_RELEASE_COMMIT" != "true" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Manual deploy cannot bypass the protected firmware signer. Deploy the exact signer-generated commit instead."
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "awaiting_signer=true" >> "$GITHUB_OUTPUT"
            echo "reason=Firmware-sensitive source is waiting for the protected signer." >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=Exact tested revision authorized." >> "$GITHUB_OUTPUT"
          fi

  # A green "Deploy site" must mean the site was published. This job used to
  # print the deferral reason and exit 0, so a revision that deferred to a
  # signer which then FAILED left every visible signal green while
  # led.mandalacodes.com kept serving the previous build. That is how build
  # 1316 stayed live for days after its replacement merged: the only red run
  # was on a different workflow that nobody was watching.
  #
  # Deferring to the signer is only legitimate if the signer actually
  # publishes. So wait for it and adopt its outcome. The other deferral reasons
  # (a newer revision owns the deploy; a signer artifact commit that deploys
  # through its own dispatch) are genuine no-ops and stay green.
  deferred:
    needs: preflight
    if: needs.preflight.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          REASON: ${{ needs.preflight.outputs.reason }}
        run: |
          echo "## Production publish: DEFERRED" >> "$GITHUB_STEP_SUMMARY"
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: A deferral to the signer is only green once the signer publishes
        if: needs.preflight.outputs.awaiting_signer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.preflight.outputs.revision }}
          REPO: ${{ github.repository }}
        run: |
          deadline=$(( $(date +%s) + 1500 ))
          conclusion=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            conclusion="$(gh api "repos/$REPO/actions/workflows/build-firmware.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
              --jq '.workflow_runs[0].conclusion // ""' 2>/dev/null || echo "")"
            [ -n "$conclusion" ] && break
            sleep 20
          done
          {
            echo ""
            echo "Signer conclusion for \`$HEAD_SHA\`: **${conclusion:-none}**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$conclusion" = "success" ]; then
            echo "Signer published; it dispatches the deploy for its own signed revision."
            exit 0
          fi
          if [ -z "$conclusion" ]; then
            echo "::error::NOT DEPLOYED. Deferred to the protected signer, but no signer run for $HEAD_SHA concluded within 25 minutes. led.mandalacodes.com is still serving the previous build."
          else
            echo "::error::NOT DEPLOYED. Deferred to the protected signer and the signer finished '$conclusion', so nothing was published and led.mandalacodes.com is still serving the previous build. Check 'Build firmware binary' for $HEAD_SHA — the usual cause is a firmware VERSION that is not greater than the one already signed."
          fi
          exit 1

  deploy:
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    needs: preflight
    env:
      DEPLOY_REVISION: ${{ needs.preflight.outputs.revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MIGRATION_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source || 'manual' }}
          EVENT_NAME: ${{ github.event_name }}
          LIGHTWEAVER_NATIVE_AUTH_READY: ${{ vars.LIGHTWEAVER_NATIVE_AUTH_READY }}
          LIGHTWEAVER_PREVIEW_ACCESS_READY: ${{ vars.LIGHTWEAVER_PREVIEW_ACCESS_READY }}
          LIGHTWEAVER_PRODUCTION_LIBRARY_READY: ${{ vars.LIGHTWEAVER_PRODUCTION_LIBRARY_READY }}
          PROJECTS_DB_DATABASE_ID: ${{ secrets.PROJECTS_DB_DATABASE_ID }}
          PROJECTS_DB_DATABASE_NAME: ${{ vars.PROJECTS_DB_DATABASE_NAME }}
          PROJECT_BLOBS_BUCKET_NAME: ${{ vars.PROJECT_BLOBS_BUCKET_NAME }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          MAX_LIBRARY_BODY_BYTES: ${{ vars.MAX_LIBRARY_BODY_BYTES }}
          MAX_LIBRARY_BACKUP_BYTES: ${{ vars.MAX_LIBRARY_BACKUP_BYTES }}
          MAX_LIBRARY_BACKUP_REVISIONS: ${{ vars.MAX_LIBRARY_BACKUP_REVISIONS }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_MIGRATION_API_TOKEN CLOUDFLARE_ACCOUNT_ID LIGHTWEAVER_PRODUCTION_LIBRARY_READY PROJECTS_DB_DATABASE_ID PROJECTS_DB_DATABASE_NAME PROJECT_BLOBS_BUCKET_NAME MAX_LIBRARY_BODY_BYTES MAX_LIBRARY_BACKUP_BYTES MAX_LIBRARY_BACKUP_REVISIONS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "$LIGHTWEAVER_NATIVE_AUTH_READY" != "confirmed" ]; then
            for name in LIGHTWEAVER_PREVIEW_ACCESS_READY ACCESS_TEAM_DOMAIN ACCESS_AUD OWNER_EMAILS; do
              if [ -z "${!name}" ]; then
                missing+=("$name")
              fi
            done
            if [ "$LIGHTWEAVER_PREVIEW_ACCESS_READY" != "confirmed" ]; then
              missing+=("LIGHTWEAVER_PREVIEW_ACCESS_READY=confirmed")
            fi
          fi
          if [ "${#missing[@]}" -eq 0 ] \
            && [ "$LIGHTWEAVER_PRODUCTION_LIBRARY_READY" = "confirmed" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare library provisioning or credentials are incomplete — skipping deploy. Missing names: ${missing[*]:-none}; readiness must be confirmed."
            # Fail loudly only for a HUMAN manual run; CI dispatches
            # (build-firmware passes source=ci) skip cleanly like push runs.
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_SOURCE" != "ci" ]; then
              echo "::error::Manual deploy requested but Cloudflare secrets are missing."
              exit 1
            fi
          fi

      - name: Install dependencies
        if: steps.creds.outputs.enabled == 'true'
        working-directory: lightweaver
        run: |
          # `npm ci` installs exactly what lightweaver/package-lock.json pins,
          # for reproducible builds (vs `npm install`, which can drift the tree).
          npm ci
          # Workaround for npm/cli#4828: npm may skip the platform-specific
          # Rollup native binding on fresh installs, breaking `vite build`.
          node scripts/ensure-rollup-native.mjs

      - name: Reconfirm the exact main revision before publish
        if: steps.creds.outputs.enabled == 'true'
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$DEPLOY_REVISION" ]; then
            echo "::error::Main advanced after preflight; refusing to publish an obsolete revision."
            exit 1
          fi

      - name: Verify the deployable signed artifacts
        if: steps.creds.outputs.enabled == 'true'
        working-directory: lightweaver
        run: npm run ci:artifact

      # Schema changes are expand-only. This token is account-scoped to D1
      # writes and is never exposed to the normal Pages deployment step.
      - name: Apply additive production D1 migrations
        id: migrate
        if: steps.creds.outputs.enabled == 'true'
        working-directory: lightweaver
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECTS_DB_DATABASE_ID: ${{ secrets.PROJECTS_DB_DATABASE_ID }}
          PROJECTS_DB_DATABASE_NAME: ${{ vars.PROJECTS_DB_DATABASE_NAME }}
        run: |
          set -euo pipefail
          if [ "$PROJECTS_DB_DATABASE_NAME" != "lightweaver-projects-production" ]; then
            echo "::error::PROJECTS_DB_DATABASE_NAME is not the canonical production database."
            exit 1
          fi
          if [[ ! "$PROJECTS_DB_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::PROJECTS_DB_DATABASE_ID is not a valid D1 database UUID."
            exit 1
          fi
          migration_source="$GITHUB_WORKSPACE/lightweaver/migrations"
          if [ ! -d "$migration_source" ]; then
            echo "::error::Migration source directory is missing."
            exit 1
          fi
          for migration in 0002_account_access.sql 0003_account_session_generation.sql; do
            if [ ! -f "$migration_source/$migration" ]; then
              echo "::error::Required native account migration is missing: $migration"
              exit 1
            fi
          done
          umask 077
          migration_root="$(mktemp -d "$RUNNER_TEMP/lightweaver-d1-migration.XXXXXX")"
          migration_config="$migration_root/wrangler.toml"
          cleanup_migration_config() {
            rm -rf -- "$migration_root"
          }
          trap cleanup_migration_config EXIT
          cat > "$migration_config" <<EOF
          name = "lightweaver-production-migrations"
          compatibility_date = "2026-07-15"

          [[d1_databases]]
          binding = "PROJECTS_DB"
          database_name = "$PROJECTS_DB_DATABASE_NAME"
          database_id = "$PROJECTS_DB_DATABASE_ID"
          migrations_dir = "$migration_source"
          EOF
          chmod 600 "$migration_config"
          npm exec -- wrangler d1 migrations apply PROJECTS_DB --config "$migration_config" --remote

      # The exact revision's Tests run is the source gate. deploy:pages still
      # builds, stages, and checks the graph immediately before upload.
      - name: Build and deploy to Cloudflare Pages
        id: publish
        if: steps.creds.outputs.enabled == 'true'
        working-directory: lightweaver
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIGHTWEAVER_NATIVE_AUTH_READY: ${{ vars.LIGHTWEAVER_NATIVE_AUTH_READY }}
          LIGHTWEAVER_PRODUCTION_LIBRARY_READY: ${{ vars.LIGHTWEAVER_PRODUCTION_LIBRARY_READY }}
          PROJECTS_DB_DATABASE_ID: ${{ secrets.PROJECTS_DB_DATABASE_ID }}
          PROJECTS_DB_DATABASE_NAME: ${{ vars.PROJECTS_DB_DATABASE_NAME }}
          PROJECT_BLOBS_BUCKET_NAME: ${{ vars.PROJECT_BLOBS_BUCKET_NAME }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          MAX_LIBRARY_BODY_BYTES: ${{ vars.MAX_LIBRARY_BODY_BYTES }}
          MAX_LIBRARY_BACKUP_BYTES: ${{ vars.MAX_LIBRARY_BACKUP_BYTES }}
          MAX_LIBRARY_BACKUP_REVISIONS: ${{ vars.MAX_LIBRARY_BACKUP_REVISIONS }}
        run: |
          # The Vite release-graph plugin validates every signed firmware byte
          # before staging/upload. Re-read the staged graph after the deploy
          # wrapper returns so the live proof below has an exact local anchor.
          npm run deploy:pages
          node ../scripts/verify-production-artifacts.mjs --root .pages/lightweaver

      - name: Verify the live Production Setup release
        id: freshness
        if: steps.creds.outputs.enabled == 'true'
        working-directory: lightweaver
        env:
          LIGHTWEAVER_NATIVE_AUTH_READY: ${{ vars.LIGHTWEAVER_NATIVE_AUTH_READY }}
          PROD_CHECK_REQUIRED: '1'
        run: |
          # Cloudflare Pages can expose the new no-store graph before every
          # content-addressed asset has reached every edge. A real production
          # rollout took just over 60 seconds, so keep the proof strict but
          # allow a bounded two-minute convergence window.
          for attempt in $(seq 1 12); do
            if node ../scripts/verify-production-artifacts.mjs --origin https://led.mandalacodes.com --expected-root .pages/lightweaver \
              && npm run check:prod; then
              exit 0
            fi
            if [ "$attempt" = 12 ]; then
              echo "::error::Production did not converge to the verified release."
              exit 1
            fi
            sleep 10
          done

      # The numbers the Studio footer and the card both show. Printed here so
      # the run page answers "which build did this publish?" without decoding a
      # commit SHA. The firmware number comes from the signed manifest, so it
      # names the build a card actually reports after a flash.
      - name: Resolve the published build numbers
        id: buildnumber
        if: always()
        run: |
          echo "value=$(git rev-list --count "$DEPLOY_REVISION")" >> "$GITHUB_OUTPUT"
          firmware="$(node -e 'const m=require("./lightweaver/public/firmware/release-manifest.json");process.stdout.write(String(m.buildNumber ?? ""))')"
          echo "firmware=${firmware:-unnumbered}" >> "$GITHUB_OUTPUT"

      - name: Record publish result
        if: always()
        env:
          BUILD_NUMBER: ${{ steps.buildnumber.outputs.value }}
          FIRMWARE_BUILD_NUMBER: ${{ steps.buildnumber.outputs.firmware }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome }}
          PUBLISH_ENABLED: ${{ steps.creds.outputs.enabled }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ "$PUBLISH_ENABLED" != "true" ]; then
            echo "## Production publish: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare provisioning or credentials were unavailable. This CI result is not a deployment and must not be used as shipment evidence." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No production publish occurred. Shipment still requires a credentialed deploy and passing live freshness check."
          elif [ "$MIGRATION_OUTCOME" != "success" ]; then
            echo "## Production publish failed before upload" >> "$GITHUB_STEP_SUMMARY"
            echo "The production migration outcome was $MIGRATION_OUTCOME; Pages upload did not complete." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Production migration did not succeed; no publish is proven."
          elif [ "$PUBLISH_OUTCOME" != "success" ]; then
            echo "## Production publish failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The Pages upload outcome was $PUBLISH_OUTCOME; no live deployment is proven." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Pages upload did not succeed."
          elif [ "$FRESHNESS_OUTCOME" != "success" ]; then
            echo "## Production uploaded; live proof failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The Pages upload succeeded, but live freshness outcome was $FRESHNESS_OUTCOME. Do not treat this run as shipped." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Live freshness proof did not succeed."
          else
            echo "## Production publish — Build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
            echo "led.mandalacodes.com now serves Studio build **$BUILD_NUMBER** (\`$DEPLOY_REVISION\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "The Studio footer beacon reads \`Studio current · Build $BUILD_NUMBER\` once your browser has it." >> "$GITHUB_STEP_SUMMARY"
            echo "Signed firmware in this release is **Build $FIRMWARE_BUILD_NUMBER** — that is the number a card reports after flashing it." >> "$GITHUB_STEP_SUMMARY"
            echo "The migration, Pages upload, and live freshness check all succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi
