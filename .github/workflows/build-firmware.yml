name: Build firmware binary

# A successful main Tests run is the only route into the protected signer.
# Every job checks out and labels the exact source revision that Tests proved.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: build-firmware-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
      build_number: ${{ steps.buildnumber.outputs.value }}
      firmware_version: ${{ steps.firmwaremeta.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Classify the tested revision
        id: changes
        env:
          CI_ACTOR: ${{ github.event.workflow_run.actor.login }}
          CI_BASE_SHA: ${{ github.event.workflow_run.head_sha }}^
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$CI_ACTOR" = "github-actions[bot]" ] \
            && [ "$(git log -1 --format=%s "$CI_HEAD_SHA")" = "CI: publish signed Lightweaver firmware release" ]; then
            export CI_GENERATED_RELEASE=true
          fi
          node scripts/ci-changed-lanes.mjs
      - name: Resolve the canonical firmware version
        id: firmwaremeta
        run: |
          version="$(tr -d '\r\n' < firmware/lightweaver-controller/VERSION)"
          node -e 'if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.argv[1])) process.exit(1)' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Commit count of the tested revision — the same number GitHub prints as
      # "N Commits". The compiled binary and the signed manifest both take THIS
      # number, so a card and the published release can never disagree about
      # which build the owner is on.
      - name: Resolve the release build number
        id: buildnumber
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "value=$(git rev-list --count "$CI_HEAD_SHA")" >> "$GITHUB_OUTPUT"

  # This job has no environment and no secrets. The tested revision must pass
  # the signing-specific contract before GitHub can unlock the protected job.
  verify:
    needs: classify
    if: needs.classify.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cache unprivileged verification dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/lightweaver-controller/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install pinned verification dependencies
        run: |
          pip install platformio==6.1.19
          npm ci --prefix lightweaver
      - name: Verify signer-sensitive contracts
        run: npm run ci:firmware-sensitive --prefix lightweaver
      - name: Require a progressing firmware version
        env:
          FW_VERSION: ${{ needs.classify.outputs.firmware_version }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(tr -d '\r\n' < firmware/lightweaver-controller/VERSION)" = "$FW_VERSION"
          npm run firmware:version:check --prefix lightweaver -- --previous-source "$SOURCE_REVISION"
      - name: Verify pinned firmware compiles with the tested identity
        env:
          LW_BUILD_ID: ${{ github.event.workflow_run.head_sha }}
          LW_BUILD_NUMBER: ${{ needs.classify.outputs.build_number }}
          LW_FIRMWARE_VERSION: ${{ needs.classify.outputs.firmware_version }}
        run: |
          pio run -d firmware/lightweaver-controller -e esp32-s3-n16r8
          node firmware/lightweaver-controller/tests/card-identity-capabilities.mjs

  build:
    needs: [classify, verify]
    runs-on: ubuntu-latest
    environment: firmware-release
    permissions:
      contents: write
      actions: write
    env:
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      BUILD_NUMBER: ${{ needs.classify.outputs.build_number }}
      FW_VERSION: ${{ needs.classify.outputs.firmware_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cache PlatformIO toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/lightweaver-controller/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Recheck firmware version before protected signing
        run: |
          test "$(tr -d '\r\n' < firmware/lightweaver-controller/VERSION)" = "$FW_VERSION"
          npm run firmware:version:check --prefix lightweaver -- --previous-source "$SOURCE_REVISION"
      - name: Rebuild tested factory binary
        env:
          LW_BUILD_ID: ${{ env.SOURCE_REVISION }}
          LW_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          LW_FIRMWARE_VERSION: ${{ env.FW_VERSION }}
        run: firmware/lightweaver-controller/scripts/build-factory-bin.sh
      - name: Build and sign immutable release set
        env:
          LIGHTWEAVER_RELEASE_SIGNING_KEY: ${{ secrets.LIGHTWEAVER_RELEASE_SIGNING_KEY }}
        run: |
          CONFIG_VERSION="$(sed -n 's/.*LW_CONFIG_SCHEMA_VERSION=\([0-9][0-9]*\).*/\1/p' firmware/lightweaver-controller/platformio.ini)"
          test -n "$FW_VERSION"
          test -n "$CONFIG_VERSION"
          node scripts/build-firmware-manifest.mjs \
            --firmware-version "$FW_VERSION" \
            --build-id "$SOURCE_REVISION" \
            --build-number "$BUILD_NUMBER" \
            --source-revision "$SOURCE_REVISION" \
            --config-min "$CONFIG_VERSION" \
            --config-max "$CONFIG_VERSION" \
            --minimum-installer 1.4.0
          node scripts/sign-release-artifacts.mjs
      - name: Rebuild production jobs against the signed release
        run: |
          node scripts/rebuild-production-jobs.mjs
          npm run test:production-jobs --prefix lightweaver
      - name: Verify signed release set
        run: npm run ci:artifact:contracts --prefix lightweaver
      - name: Commit the signed release if it changed
        id: release
        shell: bash
        run: |
          RELEASE_PATHS=(
            lightweaver/public/firmware/lightweaver-controller-esp32s3-factory.bin
            lightweaver/public/firmware/release-manifest.json
            lightweaver/public/firmware/release-manifest.sig
            lightweaver/public/firmware/release-provenance.json
            lightweaver/public/firmware/releases
            lightweaver/public/production/jobs
            release/job-sources
          )
          RELEASE_INPUTS=(
            'firmware/lightweaver-controller/src/**'
            'firmware/lightweaver-controller/VERSION'
            'firmware/lightweaver-controller/platformio.ini'
            'firmware/lightweaver-controller/scripts/**'
            'scripts/build-firmware-manifest.mjs'
            'scripts/build-production-job.mjs'
            'scripts/rebuild-production-jobs.mjs'
            'scripts/sign-release-artifacts.mjs'
            'lightweaver/src/lib/**'
            'packages/installer-core/**'
            'release/firmware-manifest.schema.json'
            'release/production-job.schema.json'
            'release/job-generators/**'
            'release/job-sources/**'
            'release/keys/lightweaver-release-public.pem'
            '.github/workflows/build-firmware.yml'
          )
          if git diff --quiet -- "${RELEASE_PATHS[@]}" && \
             test -z "$(git ls-files --others --exclude-standard -- "${RELEASE_PATHS[@]}")"; then
            npm run ci:artifact --prefix lightweaver
            echo "Signed firmware release already matches tested source."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "signed_sha=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RELEASE_PATHS[@]}"
          git commit -m "CI: publish signed Lightweaver firmware release"
          git fetch origin main
          if ! git diff --quiet "$SOURCE_REVISION..origin/main" -- "${RELEASE_INPUTS[@]}"; then
            echo "::error::Main changed a release input while this signer ran; refusing a stale signature."
            exit 1
          fi
          git rebase origin/main
          npm run ci:artifact --prefix lightweaver
          git push origin HEAD:main
          signed_sha="$(git rev-parse HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "signed_sha=$signed_sha" >> "$GITHUB_OUTPUT"
      - name: Trigger exact signed-revision deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_SHA: ${{ steps.release.outputs.signed_sha }}
        run: |
          if [ "${{ steps.release.outputs.changed }}" = "true" ]; then
            gh workflow run deploy-site.yml --ref main -f source=ci -f revision="$SIGNED_SHA"
          else
            echo "Signed release unchanged; no follow-up commit needs deployment."
          fi
      - name: Upload signed release set as one artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightweaver-controller-esp32s3-signed-release
          path: |
            lightweaver/public/firmware/release-manifest.json
            lightweaver/public/firmware/release-manifest.sig
            lightweaver/public/firmware/release-provenance.json
            lightweaver/public/firmware/releases/
          if-no-files-found: error
