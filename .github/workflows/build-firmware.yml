name: Build firmware binary

# A successful main Tests run is the only route into the protected signer.
# Every job checks out and labels the exact source revision that Tests proved.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: build-firmware-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
      firmware_bundle_only: ${{ steps.changes.outputs.firmware_bundle_only }}
      build_number: ${{ steps.buildnumber.outputs.value }}
      firmware_version: ${{ steps.firmwaremeta.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Classify the tested revision
        id: changes
        env:
          CI_ACTOR: ${{ github.event.workflow_run.actor.login }}
          CI_BASE_SHA: ${{ github.event.workflow_run.head_sha }}^
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$CI_ACTOR" = "github-actions[bot]" ] \
            && [ "$(git log -1 --format=%s "$CI_HEAD_SHA")" = "CI: publish signed Lightweaver firmware release" ]; then
            export CI_GENERATED_RELEASE=true
          fi
          # Studio-only changes whose card-embedded bundle provably did not
          # change do not need a signed firmware release. Fail-closed: anything
          # short of a byte-level match prints "false" and the signer runs
          # exactly as before.
          CI_CARD_BUNDLE_UNCHANGED="$(node scripts/ci-card-bundle-check.mjs --print)"
          export CI_CARD_BUNDLE_UNCHANGED
          node scripts/ci-changed-lanes.mjs
      - name: Resolve the canonical firmware version
        id: firmwaremeta
        run: |
          version="$(tr -d '\r\n' < firmware/lightweaver-controller/VERSION)"
          node -e 'if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.argv[1])) process.exit(1)' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Commit count of the tested revision — the same number GitHub prints as
      # "N Commits". The compiled binary and the signed manifest both take THIS
      # number, so a card and the published release can never disagree about
      # which build the owner is on.
      - name: Resolve the release build number
        id: buildnumber
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "value=$(git rev-list --count "$CI_HEAD_SHA")" >> "$GITHUB_OUTPUT"

  # This job has no environment and no secrets. The tested revision must pass
  # the signing-specific contract before GitHub can unlock the protected job.
  # A signed release is produced for real firmware changes, and on demand for
  # everything else. Studio source is embedded in the card bundle, so a colour
  # tweak would otherwise mint a release, demand a VERSION bump, and hold the
  # website behind twenty minutes of signing for a change no card is waiting
  # on. When the firmware lane fired ONLY because of that embedded copy, the
  # release is skipped and the drift ships with the next one. Bumping VERSION
  # is a hard firmware path, so it is also the on-demand trigger.
  verify:
    needs: classify
    if: needs.classify.outputs.firmware == 'true' && needs.classify.outputs.firmware_bundle_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cache unprivileged verification dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/lightweaver-controller/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install pinned verification dependencies
        run: |
          pip install platformio==6.1.19
          npm ci --prefix lightweaver
      - name: Verify signer-sensitive contracts
        run: |
          npm run ci:firmware-sensitive --prefix lightweaver
          node --test scripts/firmware-update-release.test.mjs
      - name: Require a progressing firmware version
        env:
          FW_VERSION: ${{ needs.classify.outputs.firmware_version }}
        run: |
          test "$(tr -d '\r\n' < firmware/lightweaver-controller/VERSION)" = "$FW_VERSION"
          npm run firmware:version:check --prefix lightweaver -- --previous-production
      - name: Verify pinned firmware compiles with the tested identity
        env:
          LW_BUILD_ID: ${{ github.event.workflow_run.head_sha }}
          LW_BUILD_NUMBER: ${{ needs.classify.outputs.build_number }}
          LW_FIRMWARE_VERSION: ${{ needs.classify.outputs.firmware_version }}
          LW_FIRMWARE_API_MIN: 2
          LW_FIRMWARE_API_MAX: 2
        run: |
          npm run build:card --prefix lightweaver
          pio run -d firmware/lightweaver-controller -e esp32-s3-n16r8
          node firmware/lightweaver-controller/tests/card-identity-capabilities.mjs
          node firmware/lightweaver-controller/tests/windowless-card-studio.mjs

  build:
    needs: [classify, verify]
    runs-on: ubuntu-latest
    environment: firmware-release
    permissions:
      contents: write
      actions: write
    env:
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      BUILD_NUMBER: ${{ needs.classify.outputs.build_number }}
      FW_VERSION: ${{ needs.classify.outputs.firmware_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cache PlatformIO toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/lightweaver-controller/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO and pinned Studio build dependencies
        run: |
          pip install platformio==6.1.19
          npm ci --prefix lightweaver
          npx --prefix lightweaver playwright install --with-deps chromium
      - name: Recheck firmware version before protected signing
        run: |
          test "$(tr -d '\r\n' < firmware/lightweaver-controller/VERSION)" = "$FW_VERSION"
          npm run firmware:version:check --prefix lightweaver -- --previous-production
      - name: Build the exact card-local Studio into the firmware source table
        env:
          LIGHTWEAVER_SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          LIGHTWEAVER_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          LW_FIRMWARE_API_MIN: 2
          LW_FIRMWARE_API_MAX: 2
        run: npm run build:card --prefix lightweaver
      # The identity-pinned canonical hash of the exact bundle this release
      # embeds. Future revisions whose canonical build matches this value have
      # provably not changed the card-embedded Studio, so lane classification
      # can let them deploy the site without a new signed firmware release.
      - name: Record the canonical card bundle hash for lane classification
        run: |
          node lightweaver/scripts/build-card-studio.mjs --canonical > /tmp/card-bundle-canonical-build.json
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const built = JSON.parse(readFileSync("/tmp/card-bundle-canonical-build.json", "utf8"));
            if (!/^[a-f0-9]{64}$/.test(built.bundleSha256 || "")) throw new Error("canonical bundle hash missing");
            writeFileSync("lightweaver/public/firmware/card-bundle-canonical.json", JSON.stringify({
              schemaVersion: 1,
              bundleSha256: built.bundleSha256,
              totalSize: built.totalSize,
              sourceRevision: process.env.SOURCE_REVISION || "",
            }, null, 2) + "\n");
          '
      - name: Rebuild tested factory binary with the generated card-local Studio
        env:
          LW_BUILD_ID: ${{ env.SOURCE_REVISION }}
          LW_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          LW_FIRMWARE_VERSION: ${{ env.FW_VERSION }}
        run: firmware/lightweaver-controller/scripts/build-factory-bin.sh
      - name: Build and sign immutable release set
        env:
          LIGHTWEAVER_RELEASE_SIGNING_KEY: ${{ secrets.LIGHTWEAVER_RELEASE_SIGNING_KEY }}
        run: |
          CONFIG_VERSION="$(sed -n 's/.*LW_CONFIG_SCHEMA_VERSION=\([0-9][0-9]*\).*/\1/p' firmware/lightweaver-controller/platformio.ini)"
          test -n "$FW_VERSION"
          test -n "$CONFIG_VERSION"
          FIRMWARE_API_MIN="$(node -p 'require("./lightweaver/card-dist/card-studio-release.json").firmwareApi.min')"
          FIRMWARE_API_MAX="$(node -p 'require("./lightweaver/card-dist/card-studio-release.json").firmwareApi.max')"
          PROJECT_SCHEMA_MIN="$(node -p 'require("./lightweaver/card-dist/card-studio-release.json").projectSchema.min')"
          PROJECT_SCHEMA_MAX="$(node -p 'require("./lightweaver/card-dist/card-studio-release.json").projectSchema.max')"
          RELEASE_DIRECTORY="lightweaver/public/firmware/releases/$FW_VERSION/$SOURCE_REVISION"
          node scripts/build-firmware-update-ticket.mjs \
            --firmware-version "$FW_VERSION" \
            --build-id "$SOURCE_REVISION" \
            --build-number "$BUILD_NUMBER" \
            --firmware-api-min "$FIRMWARE_API_MIN" \
            --firmware-api-max "$FIRMWARE_API_MAX" \
            --project-schema-min "$PROJECT_SCHEMA_MIN" \
            --project-schema-max "$PROJECT_SCHEMA_MAX" \
            --minimum-updater-version 1 \
            --minimum-bootstrap-build 1198
          node scripts/sign-release-artifacts.mjs \
            --kind ticket \
            --ticket "$RELEASE_DIRECTORY/firmware-update-ticket.json" \
            --ticket-signature "$RELEASE_DIRECTORY/firmware-update-ticket.sig"
          node scripts/build-firmware-manifest.mjs \
            --firmware-version "$FW_VERSION" \
            --build-id "$SOURCE_REVISION" \
            --build-number "$BUILD_NUMBER" \
            --source-revision "$SOURCE_REVISION" \
            --config-min "$CONFIG_VERSION" \
            --config-max "$CONFIG_VERSION" \
            --update-application "$RELEASE_DIRECTORY/lightweaver-controller-esp32s3-app.bin" \
            --update-ticket "$RELEASE_DIRECTORY/firmware-update-ticket.json" \
            --update-signature "$RELEASE_DIRECTORY/firmware-update-ticket.sig" \
            --minimum-installer 1.4.0
          node scripts/sign-release-artifacts.mjs --kind manifest
      - name: Rebuild production jobs against the signed release
        run: |
          node scripts/rebuild-production-jobs.mjs
          npm run test:production-jobs --prefix lightweaver
      - name: Verify signed release set
        run: npm run ci:artifact:contracts --prefix lightweaver
      - name: Commit the signed release if it changed
        id: release
        shell: bash
        run: |
          RELEASE_PATHS=(
            lightweaver/public/firmware/lightweaver-controller-esp32s3-factory.bin
            lightweaver/public/firmware/release-manifest.json
            lightweaver/public/firmware/release-manifest.sig
            lightweaver/public/firmware/release-provenance.json
            lightweaver/public/firmware/card-bundle-canonical.json
            lightweaver/public/firmware/releases
            lightweaver/public/production/jobs
            release/job-sources
            firmware/lightweaver-controller/src/LightweaverCardStudioBundle.h
          )
          RELEASE_INPUTS=(
            'firmware/lightweaver-controller/src/**'
            'firmware/lightweaver-controller/VERSION'
            'firmware/lightweaver-controller/platformio.ini'
            'firmware/lightweaver-controller/scripts/**'
            'scripts/build-firmware-manifest.mjs'
            'scripts/build-firmware-update-ticket.mjs'
            'scripts/build-production-job.mjs'
            'scripts/rebuild-production-jobs.mjs'
            'scripts/sign-release-artifacts.mjs'
            'scripts/firmware-update-release.test.mjs'
            'scripts/verify-production-artifacts.mjs'
            'lightweaver/src/**'
            'lightweaver/card.html'
            'lightweaver/vite.config.js'
            'lightweaver/scripts/build-card-studio.mjs'
            'lightweaver/scripts/prepare-local-fonts.mjs'
            'lightweaver/public/fonts/**'
            'packages/installer-core/**'
            'release/firmware-manifest.schema.json'
            'release/firmware-update-ticket.schema.json'
            'release/production-job.schema.json'
            'release/job-generators/**'
            'release/job-sources/**'
            'release/keys/lightweaver-release-public.pem'
            '.github/workflows/build-firmware.yml'
          )
          if git diff --quiet -- "${RELEASE_PATHS[@]}" && \
             test -z "$(git ls-files --others --exclude-standard -- "${RELEASE_PATHS[@]}")"; then
            npm run ci:artifact --prefix lightweaver
            npm run ci:artifact:release-ui --prefix lightweaver
            echo "Signed firmware release already matches tested source."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "signed_sha=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RELEASE_PATHS[@]}"
          git commit -m "CI: publish signed Lightweaver firmware release"
          git fetch origin main
          if ! git diff --quiet "$SOURCE_REVISION..origin/main" -- "${RELEASE_INPUTS[@]}"; then
            echo "::error::Main changed a release input while this signer ran; refusing a stale signature."
            exit 1
          fi
          git rebase origin/main
          npm run ci:artifact --prefix lightweaver
          npm run ci:artifact:release-ui --prefix lightweaver
          git push origin HEAD:main
          signed_sha="$(git rev-parse HEAD)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "signed_sha=$signed_sha" >> "$GITHUB_OUTPUT"
      - name: Trigger exact signed-revision deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_SHA: ${{ steps.release.outputs.signed_sha }}
        run: |
          if [ "${{ steps.release.outputs.changed }}" = "true" ]; then
            gh workflow run deploy-site.yml --ref main -f source=ci -f revision="$SIGNED_SHA"
          else
            echo "Signed release unchanged; no follow-up commit needs deployment."
          fi
      - name: Upload signed release set as one artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lightweaver-controller-esp32s3-signed-release
          path: |
            lightweaver/public/firmware/release-manifest.json
            lightweaver/public/firmware/release-manifest.sig
            lightweaver/public/firmware/release-provenance.json
            lightweaver/public/firmware/releases/*/*/lightweaver-controller-esp32s3-app.bin
            lightweaver/public/firmware/releases/*/*/firmware-update-ticket.json
            lightweaver/public/firmware/releases/*/*/firmware-update-ticket.sig
            lightweaver/public/firmware/releases/
            firmware/lightweaver-controller/src/LightweaverCardStudioBundle.h
          if-no-files-found: error
